<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Filing Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#fbfbf9; --fg:#1c1c1a; --mut:#6b6b66; --line:#e2e1dc; --card:#fff; --acc:#9a3412; --bar:#e8d5c8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --mut:#9c9b94; --line:#33322f; --card:#1f1f1d; --acc:#f0a070; --bar:#4a3528; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mut); margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:300px 1fr; gap:24px; align-items:start; }
  @media (max-width:860px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 10px; }
  .cat { position:relative; display:flex; justify-content:space-between; gap:8px; width:100%; padding:4px 6px; margin:2px 0;
         border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; border-radius:4px; }
  .cat i { position:absolute; inset:0 auto 0 0; background:var(--bar); border-radius:4px; z-index:0; }
  .cat span { position:relative; z-index:1; }
  .cat.on { outline:2px solid var(--acc); }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  input[type=search] { flex:1; min-width:200px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.id { white-space:nowrap; font-weight:600; }
  a { color:var(--acc); text-decoration:none; } a:hover { text-decoration:underline; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; background:var(--bar); font-size:12.5px; white-space:nowrap; }
  .tag.sec { background:none; border:1px solid var(--line); color:var(--mut); }
  .small { font-size:12.5px; color:var(--mut); }
  .new { color:var(--acc); font-size:11px; font-weight:700; margin-left:4px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { font:inherit; padding:6px 14px; border:0; background:var(--card); color:var(--fg); cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--acc); color:var(--bg); }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  #mapwrap { margin-bottom:16px; }
  #map { height:540px; border:1px solid var(--line); border-radius:8px; }
  .legend { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--mut); }
  .legend i { display:inline-block; width:120px; height:10px; border-radius:3px; background:linear-gradient(90deg,#fde0c5,#8c2d04); }
  .legend b { display:inline-block; width:14px; height:10px; border-radius:3px; background:#cfcfcf; margin-left:8px; }
  .chip { display:inline-block; padding:3px 10px; border-radius:12px; background:var(--bar); font-size:13px; cursor:pointer; }
  .maplibregl-popup-content { font:13px/1.4 system-ui, sans-serif; color:#1c1c1a; padding:10px 12px; }
  .maplibregl-popup-content h4 { margin:0 0 2px; font-size:14px; }
  #more[hidden] { display:none; }
  #more { margin:14px auto; display:block; padding:8px 16px; cursor:pointer; }
  ul.ev { list-style:none; margin:0; padding:0; max-height:320px; overflow:auto; }
  ul.ev li { padding:4px 0; border-bottom:1px solid var(--line); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Texas Filing Monitor <span id="sess"></span></h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="grid">
    <aside>
      <div class="card"><h2>Categories</h2><div id="cats"></div></div>
      <div class="card" style="margin-top:16px"><h2>Recent activity</h2><ul class="ev" id="events"></ul></div>
    </aside>
    <section>
      <div class="bar">
        <div class="seg" id="view"><button data-v="list" class="on">List</button><button data-v="map">Map</button></div>
        <span id="distchip"></span>
      </div>
      <div id="mapwrap" hidden>
        <div class="bar">
          <div class="seg" id="mapch"><button data-c="House" class="on">House</button><button data-c="Senate">Senate</button></div>
          <span class="legend"><span id="lmin">1</span><i></i><span id="lmax"></span><b></b>none</span>
          <span class="small" id="mapnote"></span>
        </div>
        <div id="map"></div>
        <div class="small" id="unplaced" style="margin-top:6px"></div>
      </div>
      <div class="filters">
        <input type="search" id="q" placeholder="Search bill number, caption, author…">
        <select id="chamber"><option value="">Both chambers</option><option>House</option><option>Senate</option></select>
        <select id="basis"><option value="">Text or caption</option><option value="text">Categorized from text</option><option value="caption">Caption only</option></select>
        <select id="sort"><option value="new">Newest filed</option><option value="num">Bill number</option><option value="conf">Lowest confidence</option></select>
      </div>
      <div class="small" id="count"></div>
      <table><thead><tr><th>Bill</th><th>Filed</th><th>Caption</th><th>Category</th></tr></thead><tbody id="rows"></tbody></table>
      <button id="more" hidden>Show more</button>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let bills = [], meta = {}, members = [], cat = "", limit = 300;
let view = "list", mapCh = "House", dist = null, map = null, mapReady = false, popup = null, stats = {};
const geo = {};

// --- author -> district matching -------------------------------------------------
const norm = s => String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/-/g, " ").replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim();
const matchCache = {};
function matchAuthor(author, chamber) {
  const key = chamber + "|" + author;
  if (key in matchCache) return matchCache[key];
  const i = author.indexOf(","), last = norm(i < 0 ? author : author.slice(0, i)), first = i < 0 ? "" : norm(author.slice(i + 1));
  const pool = members.filter(m => m.chamber === chamber);
  let m = pool.filter(x => norm(x.family) === last);
  if (!m.length) m = pool.filter(x => norm(x.name).endsWith(" " + last));
  if (first) {
    const toks = first.split(" ");
    m = m.filter(x => { const g = norm(x.given), nm = norm(x.name).split(" ");
      return toks.some(t => t.startsWith(g) || g.startsWith(t.slice(0, 3)) || nm.includes(t)); });
  }
  return matchCache[key] = m.length === 1 ? m[0] : null;
}
const get = f => fetch("data/" + f, {cache: "no-store"}).then(r => r.ok ? r.json() : Promise.reject(f));

Promise.all([get("bills.json"), get("meta.json"), get("changes.json").catch(() => []), get("members.json").catch(() => [])]).then(([b, m, ev, mem]) => {
  bills = b; meta = m; members = mem;
  for (const x of bills) x.dists = [...new Set((x.authors || []).map(a => matchAuthor(a, x.chamber)).filter(Boolean).map(mm => mm.district))];
  $("sess").textContent = m.session;
  $("sub").textContent = `${m.total} filings tracked, ${m.with_text} with text posted. Last change ${fmt(m.last_change)}; checked ${fmt(m.checked)}.`;
  $("events").innerHTML = ev.slice(-150).reverse().map(e => {
    const what = e.event === "new" ? `filed, ${esc(e.category)}`
      : e.event === "text_posted" ? `text posted, ${e.was && e.was !== e.category ? esc(e.was) + " → " : ""}${esc(e.category)}`
      : `caption changed, ${esc(e.category)}`;
    return `<li><b>${esc(e.bill)}</b> ${what} <span class="small">${fmt(e.ts)}</span></li>`;
  }).join("") || "<li class='small'>Nothing yet.</li>";
  drawCats(); draw();
}).catch(() => { $("sub").textContent = "No data yet. Run monitor.py or wait for the first scheduled run."; });

function fmt(ts) { return ts ? new Date(ts).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "never"; }

function drawCats() {
  const entries = Object.entries(meta.by_category || {}), max = Math.max(1, ...entries.map(e => e[1]));
  $("cats").innerHTML = entries.map(([c, n]) =>
    `<button class="cat${c === cat ? " on" : ""}" data-c="${esc(c)}"><i style="width:${100 * n / max}%"></i><span>${esc(c)}</span><span>${n}</span></button>`).join("");
}
$("cats").onclick = e => { const b = e.target.closest(".cat"); if (!b) return; cat = cat === b.dataset.c ? "" : b.dataset.c; limit = 300; drawCats(); draw(); };

function draw() {
  const q = $("q").value.trim().toLowerCase(), ch = $("chamber").value, ba = $("basis").value, so = $("sort").value;
  const base = bills.filter(b =>
    (!cat || b.category === cat || (b.secondary || []).includes(cat)) && (!ba || b.basis === ba) &&
    (!q || (b.id + " " + b.id.replace(" ", "") + " " + b.caption + " " + (b.authors || []).join(" ")).toLowerCase().includes(q)));
  let r = base.filter(b => (!ch || b.chamber === ch) && (!dist || (b.chamber === dist.chamber && b.dists.includes(dist.d))));
  $("distchip").innerHTML = dist ? `<span class="chip" title="Clear district filter">${dist.chamber} District ${dist.d} ✕</span>` : "";
  if (view === "map") drawMap(base);
  const num = (a, b) => a.type.localeCompare(b.type) || a.number - b.number;
  r.sort(so === "num" ? num
    : so === "conf" ? (a, b) => a.confidence - b.confidence || num(a, b)
    : (a, b) => (b.filed || b.first_seen || "").localeCompare(a.filed || a.first_seen || "") || num(a, b));
  $("count").textContent = `${r.length} shown`;
  const fresh = meta.last_change;
  $("rows").innerHTML = r.slice(0, limit).map(b => {
    const hist = `https://capitol.texas.gov/BillLookup/History.aspx?LegSess=${encodeURIComponent(meta.session)}&Bill=${b.type}${b.number}`;
    return `<tr>
      <td class="id"><a href="${hist}" target="_blank" rel="noopener">${esc(b.id)}</a>${b.first_seen === fresh ? '<span class="new">NEW</span>' : ""}
        <div class="small">${esc((b.authors || []).slice(0, 2).join(", "))}${(b.authors || []).length > 2 ? " +" + (b.authors.length - 2) : ""}</div></td>
      <td class="small">${esc(b.filed || "")}</td>
      <td>${esc(b.caption || "(caption pending: filed within the last hour or so)")}
        <div class="small">${b.has_text ? `<a href="${esc(b.text_url)}" target="_blank" rel="noopener">bill text</a>` : "text not posted"}${(b.tlo_subjects || []).length ? " · TLO: " + esc(b.tlo_subjects.slice(0, 3).join("; ")) : ""}</div></td>
      <td><span class="tag">${esc(b.category)}</span> ${(b.secondary || []).map(s => `<span class="tag sec">${esc(s)}</span>`).join(" ")}
        <div class="small" title="${esc((b.evidence || []).join(", "))}">${b.basis === "text" ? "from text" : "from caption"} · ${Math.round(100 * (b.confidence || 0))}%</div></td>
    </tr>`;
  }).join("");
  $("more").hidden = r.length <= limit;
}
// --- map ---------------------------------------------------------------------------
function drawMap(base) {
  stats = {};
  const unplaced = {};
  for (const b of base) {
    if (b.chamber !== mapCh) continue;
    for (const a of b.authors || []) {
      const m = matchAuthor(a, b.chamber);
      if (!m) { unplaced[a] = (unplaced[a] || 0) + 1; continue; }
      const s = stats[m.district] || (stats[m.district] = {n: 0, cats: {}, member: m});
      s.n++; s.cats[b.category] = (s.cats[b.category] || 0) + 1;
    }
  }
  const max = Math.max(2, ...Object.values(stats).map(s => s.n));
  $("lmax").textContent = max;
  $("mapnote").textContent = "Filings per district" + (cat ? " in " + cat : "") + ". Click a district to filter the list.";
  const up = Object.entries(unplaced);
  $("unplaced").textContent = up.length ? "Not placed on the map (author not matched to a district): " + up.map(([a, n]) => `${a} (${n})`).join(", ") : "";
  if (!map) return initMap();
  if (!mapReady) return;
  const show = g => {
    for (const f of g.features) f.properties.n = (stats[f.properties.d] || {n: 0}).n;
    map.getSource("dist").setData(g);
    map.setPaintProperty("dist-fill", "fill-color", ["case", ["==", ["get", "n"], 0], "#cfcfcf",
      ["interpolate", ["linear"], ["get", "n"], 1, "#fde0c5", max, "#8c2d04"]]);
    map.setFilter("dist-sel", ["==", ["get", "d"], dist && dist.chamber === mapCh ? dist.d : -1]);
  };
  const want = mapCh;
  if (geo[want]) show(geo[want]);
  else get("districts_" + want.toLowerCase() + ".geojson").then(g => { geo[want] = g; if (mapCh === want) show(g); });
}

function initMap() {
  map = new maplibregl.Map({container: "map", style: "https://tiles.openfreemap.org/styles/positron",
    bounds: [[-106.7, 25.8], [-93.5, 36.6]], fitBoundsOptions: {padding: 20}});
  map.addControl(new maplibregl.NavigationControl({showCompass: false}));
  popup = new maplibregl.Popup({closeButton: false, closeOnClick: false, maxWidth: "280px"});
  map.on("load", () => {
    const firstLabel = (map.getStyle().layers.find(l => l.type === "symbol") || {}).id;
    map.addSource("dist", {type: "geojson", data: {type: "FeatureCollection", features: []}});
    map.addLayer({id: "dist-fill", type: "fill", source: "dist",
      paint: {"fill-color": "#cfcfcf", "fill-opacity": ["case", ["==", ["get", "n"], 0], 0.3, 0.75]}}, firstLabel);
    map.addLayer({id: "dist-line", type: "line", source: "dist", paint: {"line-color": "#5c5348", "line-width": 0.6}}, firstLabel);
    map.addLayer({id: "dist-sel", type: "line", source: "dist", paint: {"line-color": "#111", "line-width": 2.5},
      filter: ["==", ["get", "d"], -1]}, firstLabel);
    map.on("mousemove", "dist-fill", e => {
      const d = e.features[0].properties.d, s = stats[d];
      map.getCanvas().style.cursor = "pointer";
      let h = `<h4>${mapCh} District ${d}</h4>`;
      if (s) {
        const top = Object.entries(s.cats).sort((a, b) => b[1] - a[1]).slice(0, 4);
        h += `<div>${esc(s.member.name)} (${esc(s.member.party)})</div><div><b>${s.n}</b> filing${s.n === 1 ? "" : "s"}${cat ? " in " + esc(cat) : ""}</div>`
          + (cat ? "" : `<div style="margin-top:4px;color:#555">${top.map(([c, n]) => `${esc(c)}: ${n}`).join("<br>")}</div>`);
      } else h += `<div style="color:#555">No filings${cat ? " in " + esc(cat) : ""} yet</div>`;
      popup.setLngLat(e.lngLat).setHTML(h).addTo(map);
    });
    map.on("mouseleave", "dist-fill", () => { map.getCanvas().style.cursor = ""; popup.remove(); });
    map.on("click", "dist-fill", e => {
      const d = e.features[0].properties.d;
      dist = dist && dist.chamber === mapCh && dist.d === d ? null : {chamber: mapCh, d};
      limit = 300; draw();
    });
    mapReady = true; draw();
  });
}
$("view").onclick = e => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.v;
  for (const x of $("view").children) x.classList.toggle("on", x === b);
  $("mapwrap").hidden = view !== "map"; draw(); if (map) map.resize(); };
$("mapch").onclick = e => { const b = e.target.closest("button"); if (!b) return; mapCh = b.dataset.c;
  for (const x of $("mapch").children) x.classList.toggle("on", x === b);
  if (dist && dist.chamber !== mapCh) dist = null; if (popup) popup.remove(); draw(); };
$("distchip").onclick = () => { dist = null; draw(); };
for (const id of ["q", "chamber", "basis", "sort"]) $(id).addEventListener("input", () => { limit = 300; draw(); });
$("more").onclick = () => { limit += 300; draw(); };
</script>
</body>
</html>
