name: monitor
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: text-${{ github.run_id }}
          restore-keys: text-
      - run: python -u monitor.py
      - name: Commit data
        run: |
          git config user.name "filing-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update filings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
